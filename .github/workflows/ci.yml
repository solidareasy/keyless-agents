name: CI

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject runtime dependencies
        run: node --input-type=module -e "import fs from 'node:fs'; if (Object.hasOwn(JSON.parse(fs.readFileSync('package.json', 'utf8')), 'dependencies')) { console.error('Runtime dependencies are forbidden'); process.exit(1); }"
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level=high

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned release, SHA-256 verified)
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scanner fails on a synthetic secret
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: bash scripts/secret-scan.sh self-test
      - name: Scanner detects a secret introduced only by a merge
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: bash scripts/secret-scan-merge-test.sh
      - name: Scanner rejects inline and checkout-config suppressions
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: bash scripts/secret-scan-suppression-test.sh
      - name: Scan every commit of the change
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/secret-scan.sh
